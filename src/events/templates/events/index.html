<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
    <div class="events__block">
        {% for event in events %}
            <h4>Событие: {{ event.name }}</h4>
            <p>Дата: {{ event.date }}</p>
            <div class="attendee__block">
                {{ event.get_attendees }}
            </div>
        {% endfor %}
    </div>
</body>
</html>
